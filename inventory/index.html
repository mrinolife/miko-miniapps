<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10251f"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>Body Kitchen</title><link rel="manifest" href="./manifest.webmanifest"><script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--ink:#17211d;--muted:#66726c;--paper:#f3f0e7;--panel:#fbf9f2;--line:#cfcabd;--leaf:#245b46;--leaf2:#dbe6dc;--amber:#b86825;--red:#9d3f35;--yellow:#f0c75e;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}.mast{padding:22px 4px 12px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink)}.brand{font-family:Georgia,serif;font-size:27px;line-height:1}.brand small{display:block;font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);margin-bottom:5px}.day{font:700 12px ui-monospace,monospace;color:var(--muted)}
    .rescue{margin:16px 0;padding:18px;background:var(--leaf);color:#fff;border-radius:var(--radius);position:relative;overflow:hidden}.rescue:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffff40;border-radius:50%;right:-55px;top:-60px}.kicker{font:800 11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#cce2d3}.rescue h1{font:600 25px/1.05 Georgia,serif;margin:8px 0 5px;max-width:78%}.rescue p{margin:0;color:#e5eee8;font-size:14px}.rescue button{margin-top:15px;background:var(--yellow);color:#282315;border:0;border-radius:12px;min-height:48px;padding:0 16px;font-weight:850}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 9px}.section-head h2{margin:0;font:600 21px Georgia,serif}.section-head button{border:0;background:none;color:var(--leaf);font-weight:800;padding:8px}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 13px;color:var(--muted);font-weight:750}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}
    .list{display:grid;gap:8px}.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px}.thumb{width:52px;height:52px;border-radius:13px;background:var(--leaf2);display:grid;place-items:center;font:700 20px Georgia,serif;color:var(--leaf)}.item h3{margin:0 0 3px;font-size:15px}.meta{font-size:12px;color:var(--muted)}.expiry{font:800 11px ui-monospace,monospace;padding:6px 8px;border-radius:8px;background:#e1eadf;color:var(--leaf);text-align:center}.expiry.soon{background:#f7dfb8;color:#7d4818}.expiry.now{background:#eed0ca;color:var(--red)}.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center;background:#ffffff55}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#f7f4eced;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;z-index:10}.nav button{min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.nav .add{background:var(--ink);color:white;font-size:15px}
    dialog{border:0;padding:0;border-radius:22px;max-width:520px;width:calc(100% - 24px);background:var(--panel);color:var(--ink)}dialog::backdrop{background:#101713aa}.sheet{padding:20px}.sheet h2{font:600 24px Georgia,serif;margin:0 0 5px}.sheet p{margin:0 0 16px;color:var(--muted);font-size:13px}.field{margin:11px 0}.field label{display:block;font:800 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);background:white;border-radius:12px;padding:0 12px;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:17px}.actions button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:transparent;padding:0 15px;font-weight:800}.actions .primary{background:var(--leaf);color:white;border-color:var(--leaf);flex:1}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quick button{min-height:44px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:750}.recipe{border-top:1px solid var(--line);padding:13px 2px}.recipe h3{font-size:15px;margin:0 0 4px}.recipe p{font-size:12px;color:var(--muted);margin:0}.hidden{display:none!important}@media(min-width:700px){.shell{padding-left:24px;padding-right:24px}.list{grid-template-columns:1fr 1fr}.nav{left:50%;transform:translateX(-50%);max-width:760px}}
  </style>
</head>
<body><main class="shell">
  <header class="mast"><div class="brand"><small>Body system</small>Kitchen</div><div class="day" id="today"></div></header>
  <section class="rescue"><div class="kicker">Use-first queue</div><h1 id="rescueTitle">Your kitchen has a plan.</h1><p id="rescueCopy">Add what you have. Body will keep the urgent food visible.</p><button id="cookBtn">Show me the easiest meal</button></section>
  <div class="section-head"><h2>What’s here</h2><button id="addText">Add item</button></div>
  <div class="filters" id="filters"><button class="chip active" data-f="all">All</button><button class="chip" data-f="urgent">Use soon</button><button class="chip" data-f="fridge">Fridge</button><button class="chip" data-f="freezer">Freezer</button><button class="chip" data-f="pantry">Pantry</button></div>
  <div class="list" id="list"></div>
  <section id="mealSection" class="hidden"><div class="section-head"><h2>Low-friction meals</h2><button id="closeMeals">Close</button></div><div id="recipes"></div></section>
</main>
<nav class="nav"><button id="homeBtn">Kitchen</button><button class="add" id="addBtn">Add food</button><button onclick="location.href='./recipes/'">Recipe box</button></nav>
<dialog id="addDialog"><form class="sheet" id="addForm"><h2>Put it where you’ll find it</h2><p>Fast is better than perfect. Name + location is enough.</p><a href="./capture/" style="display:grid;place-items:center;min-height:50px;border-radius:12px;background:var(--ink);color:white;text-decoration:none;font-weight:850;margin-bottom:14px">Photograph the fridge</a><div class="field"><label for="name">Food</label><input id="name" required placeholder="Greek yogurt, leftover pho…" autocomplete="off"></div><div class="row"><div class="field"><label for="place">Location</label><select id="place"><option>fridge</option><option>freezer</option><option>pantry</option></select></div><div class="field"><label for="qty">Amount</label><input id="qty" placeholder="2 cups / half"></div></div><div class="field"><label>When should we use it?</label><div class="quick"><button type="button" data-days="2">2 days</button><button type="button" data-days="5">5 days</button><button type="button" data-days="14">2 weeks</button></div><input id="expiry" type="date" style="margin-top:8px"></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save food</button></div></form></dialog>
<script>
const KEY='body-kitchen-v1', tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()}
const seed=[{id:1,name:'Leftover chicken',place:'fridge',qty:'1 container',expiry:datePlus(1)},{id:2,name:'Greek yogurt',place:'fridge',qty:'3 cups',expiry:datePlus(4)},{id:3,name:'Frozen edamame',place:'freezer',qty:'1 bag',expiry:datePlus(40)},{id:4,name:'Jasmine rice',place:'pantry',qty:'half bag',expiry:datePlus(90)}];
let items=JSON.parse(localStorage.getItem(KEY)||'null')||seed, filter='all';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function datePlus(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function days(x){return Math.ceil((new Date(x+'T23:59:59')-new Date())/864e5)}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function render(){const sorted=[...items].sort((a,b)=>a.expiry.localeCompare(b.expiry)), shown=sorted.filter(x=>filter==='all'||x.place===filter||(filter==='urgent'&&days(x.expiry)<=3));
 $('#list').innerHTML=shown.length?shown.map(x=>{let d=days(x.expiry),cl=d<=1?'now':d<=3?'soon':'',label=d<0?'check today':d===0?'today':d===1?'tomorrow':d+' days';return `<article class="item" data-id="${x.id}"><div class="thumb">${x.name[0].toUpperCase()}</div><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.qty||'amount unknown')} · ${x.place}</div></div><button class="expiry ${cl}" aria-label="Use ${esc(x.name)}">${label}<br><span>use</span></button></article>`}).join(''):'<div class="empty">Nothing in this view. Add food by photo or in a few taps.</div>';
 const u=sorted.filter(x=>days(x.expiry)<=3);$('#rescueTitle').textContent=u.length?`${u.length} item${u.length>1?'s':''} need a decision.`:'Nothing urgent right now.';$('#rescueCopy').textContent=u.length?`${u.slice(0,2).map(x=>x.name).join(' and ')} are first in line.`:'Your use-first queue is clear.';
 $$('.expiry').forEach(b=>b.onclick=()=>useItem(+b.closest('.item').dataset.id)); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function useItem(id){const x=items.find(v=>v.id===id);if(!x)return; if(confirm(`Used or finished ${x.name}?`)){items=items.filter(v=>v.id!==id);save();render();tg?.HapticFeedback.notificationOccurred('success');tg?.sendData(JSON.stringify({type:'inventory_used',item:x.name}))}}
function openAdd(){ $('#addDialog').showModal();setTimeout(()=>$('#name').focus(),80)}
$('#addBtn').onclick=$('#addText').onclick=openAdd;$('#cancel').onclick=()=>$('#addDialog').close();$$('[data-days]').forEach(b=>b.onclick=()=>$('#expiry').value=datePlus(+b.dataset.days));
$('#addForm').onsubmit=e=>{e.preventDefault();const x={id:Date.now(),name:$('#name').value.trim(),place:$('#place').value,qty:$('#qty').value.trim(),expiry:$('#expiry').value||datePlus(5)};items.push(x);save();e.target.reset();$('#addDialog').close();render();tg?.HapticFeedback.notificationOccurred('success');tg?.sendData(JSON.stringify({type:'inventory_added',item:x}))};
$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
function showMeals(){const urgent=[...items].sort((a,b)=>a.expiry.localeCompare(b.expiry)).slice(0,4), names=urgent.map(x=>x.name.toLowerCase());let r=[];if(names.some(x=>x.includes('chicken'))&&names.some(x=>x.includes('rice')))r.push(['Chicken rice bowl','Reheat rice + chicken. Add any sauce or crunchy thing.','10 min · one bowl']);if(names.some(x=>x.includes('yogurt')))r.push(['Yogurt rescue bowl','Yogurt + fruit, cereal, nuts, or jam. Any two are enough.','3 min · no cooking']);r.push(['Use-first plate',urgent.slice(0,3).map(x=>x.name).join(' + ')||'Add food first, then Body can build this.','Lowest effort']);$('#recipes').innerHTML=r.map(x=>`<article class="recipe"><h3>${x[0]}</h3><p>${x[1]} · ${x[2]}</p></article>`).join('');$('#mealSection').classList.remove('hidden');$('#mealSection').scrollIntoView({behavior:'smooth'})}
$('#cookBtn').onclick=showMeals;$('#closeMeals').onclick=()=>$('#mealSection').classList.add('hidden');$('#homeBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('#today').textContent=new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'numeric'}).format(new Date()).toUpperCase();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
