<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><title>Visual Cook Path</title><style>:root{--paper:#f3f0e7;--panel:#fffdf7;--ink:#17211d;--muted:#66726c;--line:#cec8b9;--leaf:#245b46;--yellow:#f2c85a;--brick:#a34b3d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Segoe UI",sans-serif}.shell{max-width:620px;margin:auto;padding:18px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between}.close,.quiet{min-height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;font-weight:800;padding:0 13px}.eyebrow{font:800 10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}h1{font:600 26px/1.05 Georgia,serif;margin:8px 0 4px}.sub{font-size:12px;color:var(--muted)}.phases{display:flex;gap:5px;margin:17px 0}.phase{height:6px;flex:1;background:#d9d4c8;border-radius:8px}.phase.done{background:var(--leaf)}.phase.now{background:var(--yellow)}.map{display:flex;justify-content:space-between;font:700 10px ui-monospace,monospace;color:var(--muted);margin-top:-10px}.visual{margin-top:17px;background:#dce7de;border:1px solid #b8c9bc;border-radius:23px;overflow:hidden;height:286px;display:grid;place-items:center;position:relative}.visual svg{width:88%;height:88%}.visual .label{position:absolute;top:13px;left:13px;background:var(--yellow);padding:7px 9px;font:800 10px ui-monospace,monospace;text-transform:uppercase;transform:rotate(-1.5deg)}.step{padding:18px 3px 4px}.step small{font:800 10px ui-monospace,monospace;color:var(--brick);letter-spacing:.12em;text-transform:uppercase}.step h2{font:600 30px/1.05 Georgia,serif;margin:7px 0}.amount{display:inline-block;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-weight:900;margin:3px 0 10px}.step p{font-size:15px;line-height:1.45;color:#46524c;margin:0}.cue{margin:14px 0;background:#eee4d5;border-left:4px solid var(--brick);padding:12px;font-size:13px;line-height:1.4}.cue b{display:block;color:var(--brick);margin-bottom:3px}.details{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:0 13px;margin:13px 0}.details summary{min-height:48px;display:flex;align-items:center;font-weight:850}.details p{font-size:13px;line-height:1.45;color:var(--muted);margin:0 0 13px}.resume{width:100%;min-height:48px;border:1px dashed var(--leaf);background:transparent;color:var(--leaf);border-radius:12px;font-weight:850}.nav{position:fixed;bottom:0;left:0;right:0;background:#f3f0e7ec;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;backdrop-filter:blur(10px)}.nav button{min-height:54px;border-radius:14px;font-weight:900}.prev{width:72px;border:1px solid var(--line);background:var(--panel)}.next{flex:1;border:0;background:var(--leaf);color:white}.notice{position:fixed;inset:0;background:#101914d9;display:none;place-items:center;padding:20px}.notice.show{display:grid}.notice-card{max-width:340px;background:var(--panel);border-radius:20px;padding:21px}.notice-card h3{font:600 25px Georgia,serif;margin:0 0 7px}.notice-card p{color:var(--muted);font-size:14px;line-height:1.45}.notice-card button{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--yellow);font-weight:900}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main class="shell"><div class="top"><button class="close" onclick="location.href='../../'">‹ Recipe</button><button class="quiet" id="quiet">Read aloud</button></div><div class="eyebrow">Visual Cook Path · demo</div><h1>Crispy salmon rice bowl</h1><div class="sub" id="state">Step 2 of 5 · Prep phase · about 18 minutes to eat</div><div class="phases"><i class="phase done"></i><i class="phase now"></i><i class="phase"></i><i class="phase"></i></div><div class="map"><span>Gather</span><span>Prep</span><span>Cook</span><span>Finish</span></div><section class="visual" id="visual"><span class="label">What this looks like</span></section><section class="step"><small id="stepno">One thing now</small><h2 id="title"></h2><div class="amount" id="amount"></div><p id="words"></p></section><div class="cue" id="cue"></div><details class="details"><summary>Show me more detail</summary><p id="detail"></p></details><button class="resume" id="interrupt">I got interrupted</button></main><nav class="nav"><button class="prev" id="prev">Back</button><button class="next" id="next">Done — next picture</button></nav><div class="notice" id="notice"><div class="notice-card"><div class="eyebrow">Paused safely</div><h3>Here’s where you were.</h3><p id="resumeText"></p><button id="return">Return to this picture</button></div></div><script>const steps=[{title:'Put everything nearby',amount:'5 items',words:'Set out salmon, cooked rice, cucumber, sauce, and one pan.',cue:'You are done when all five are visible. Nothing needs opening yet.',detail:'This “gather” picture prevents mid-step searching. If something is missing, the substitution button would appear here.',svg:'<svg viewBox="0 0 400 250" fill="none"><rect x="30" y="145" width="340" height="36" rx="18" fill="#245b46"/><circle cx="86" cy="112" r="38" fill="#f2c85a"/><rect x="140" y="75" width="72" height="67" rx="15" fill="#ed8b72"/><path d="M244 137c9-56 37-76 70-63 14 35-11 68-70 63Z" fill="#77a878"/><rect x="322" y="90" width="28" height="55" rx="8" fill="#a34b3d"/></svg>'},{title:'Slice the cucumber',amount:'½ cucumber',words:'Make thick half-moons. They do not need to match.',cue:'Stop when the pieces are easy to pick up with a fork.',detail:'Place the flat cut side down so it cannot roll. No cucumber? Use shredded cabbage or leave it out.',svg:'<svg viewBox="0 0 400 250" fill="none"><rect x="35" y="42" width="330" height="166" rx="25" fill="#f8f2df" stroke="#245b46" stroke-width="4"/><rect x="70" y="110" width="148" height="48" rx="24" fill="#39795a"/><path d="M94 111v46M128 111v46M162 111v46M196 111v46" stroke="#b9d39b" stroke-width="6"/><path d="M235 137c0-22 18-40 40-40v80c-22 0-40-18-40-40ZM282 137c0-22 18-40 40-40v80c-22 0-40-18-40-40Z" fill="#78a85f" stroke="#245b46" stroke-width="4"/><path d="m273 55 68 68-17 17-68-68Z" fill="#a34b3d"/><path d="m256 72 68 68-18 18-68-68Z" fill="#d9ddd7"/></svg>'},{title:'Cook the salmon',amount:'1 salmon fillet',words:'Put it in the hot pan, skin-side down. Leave it alone for 4 minutes.',cue:'Look for opaque color climbing halfway up the side. Use a verified food thermometer for safe doneness.',detail:'The picture shows position and visual change—not proof of safety. The production app would show the current authoritative temperature guidance.',svg:'<svg viewBox="0 0 400 250" fill="none"><ellipse cx="200" cy="148" rx="151" ry="69" fill="#17211d"/><ellipse cx="200" cy="139" rx="125" ry="48" fill="#43554c"/><path d="M125 128c36-52 111-52 150 0-29 44-118 44-150 0Z" fill="#ee8d74"/><path d="M144 128c30-27 82-27 112 0" stroke="#f8c6ae" stroke-width="9"/><path d="M86 77c-15-20 13-28 2-47M126 67c-15-20 13-28 2-47" stroke="#a34b3d" stroke-width="6" stroke-linecap="round"/></svg>'},{title:'Build your bowl',amount:'1 bowl',words:'Rice first. Add salmon and cucumber in separate sections. Spoon sauce on the side.',cue:'Keeping components separate preserves texture and lets you control each bite.',detail:'If mixed textures are preferred, the alternate visual would show everything tossed together.',svg:'<svg viewBox="0 0 400 250"><path d="M65 84h270c-13 97-63 132-135 132S78 181 65 84Z" fill="#f8f2df" stroke="#17211d" stroke-width="5"/><path d="M77 94c31-30 85-34 121 1-15 35-74 50-121-1Z" fill="#fff"/><path d="M204 97c40-34 89-19 119 0-15 39-73 54-119 0Z" fill="#ee8d74"/><circle cx="171" cy="147" r="23" fill="#77a878"/><circle cx="214" cy="164" r="21" fill="#77a878"/></svg>'},{title:'Save what worked',amount:'10-second check-in',words:'Tap liked, okay, or not for me. Add a note only if you want.',cue:'Your real experience improves the next recipe draw. No rating is required.',detail:'Optional fields include texture, actual time, cleanup, substitutions, household reaction, and more like this.',svg:'<svg viewBox="0 0 400 250"><rect x="64" y="40" width="272" height="174" rx="24" fill="#fffdf7" stroke="#17211d" stroke-width="5"/><path d="M107 92h186M107 130h124M107 168h155" stroke="#245b46" stroke-width="13" stroke-linecap="round"/><circle cx="298" cy="168" r="24" fill="#f2c85a"/><path d="m286 168 8 8 17-19" stroke="#17211d" stroke-width="6" fill="none"/></svg>'}];let i=1;const $=s=>document.querySelector(s);function render(){const s=steps[i];$('#visual').innerHTML='<span class="label">What this looks like</span>'+s.svg;$('#title').textContent=s.title;$('#amount').textContent=s.amount;$('#words').textContent=s.words;$('#cue').innerHTML='<b>How you know you are done</b>'+s.cue;$('#detail').textContent=s.detail;$('#state').textContent=`Step ${i+1} of ${steps.length} · ${['Gather','Prep','Cook','Finish','Remember'][i]} phase`;$('#prev').disabled=i===0;$('#next').textContent=i===steps.length-1?'Finish recipe':'Done — next picture';document.querySelectorAll('.phase').forEach((x,n)=>{x.className='phase '+(n<i?'done':n===i?'now':'')})}$('#next').onclick=()=>{if(i<steps.length-1){i++;render();scrollTo({top:0,behavior:'smooth'})}else location.href='../../'};$('#prev').onclick=()=>{if(i){i--;render()}};$('#interrupt').onclick=()=>{$('#resumeText').textContent=`You were on “${steps[i].title}.” Nothing else has been marked complete.`;$('#notice').classList.add('show')};$('#return').onclick=()=>$('#notice').classList.remove('show');$('#quiet').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(`${steps[i].title}. ${steps[i].words}. ${steps[i].cue}`))};render();</script></body></html>
